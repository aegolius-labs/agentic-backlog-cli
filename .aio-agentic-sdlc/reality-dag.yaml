- id: 2ebf00ef-c11d-501f-add4-f86a1df8be8a
  type: component
  name: ingest_diff
  description: "\r\n    Loads intention/reality DAGs via DAGManager, uses DiffingEngine\
    \ to calculate the diff,\r\n    and merges the resulting tasks and edges into\
    \ the local framework backlog\r\n    using core.load_backlog and core.save_backlog,\
    \ followed by core.prioritize_items.\r\n    "
- id: aa788b5d-b918-5414-b688-a1db5fda7ea4
  type: component
  name: execute_task_with_agent
  description: "\r\n    Instantiates the Agent using LocalAgentConfig. Configures\
    \ system_instructions\r\n    for the 'sdlc_orchestrator' role, applies CapabilitiesConfig,\
    \ and streams\r\n    the chat response for the task provided.\r\n    "
- id: 47757762-ac3c-582e-a93a-0bee49c1de94
  type: component
  name: main_loop
  description: "\r\n    1. Invokes ingest_diff().\r\n    2. Fetches the highest-priority\
    \ unblocked task via core.get_next_item().\r\n    3. Sets task status to 'In Progress'\
    \ via core.set_status().\r\n    4. Awaits execute_task_with_agent(task).\r\n \
    \   5. Marks status 'Completed' (or 'Blocked' on failure).\r\n    "
