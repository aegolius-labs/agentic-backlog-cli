  description: The central Orchestrator agent that manages the Software Development
    Life Cycle, delegating work to specialized subagents.
- id: bdffa5b3-fa12-54cf-99c0-a567938595f5
  type: agent
  name: sdlc_qa
  description: Subagent responsible for comprehensive testing, fuzzing, and adversarial
    code validation.
- id: bdf19ef6-c810-53c0-8562-914d4bc3b507
  type: agent
  name: sdlc_researcher
  description: Subagent responsible for deep technical and product viability research,
    acting as a Research Swarm Orchestrator.
- id: 1f2db192-e092-5b9f-b281-878f83be11a1
  type: agent
  name: sdlc_scribe
  description: Subagent responsible for updating user-facing documentation (README,
    CONTRIBUTING, docs/) to align with reality before delivery.
